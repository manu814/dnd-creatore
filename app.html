<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crea il tuo eroe</title>
<style>
:root {
  --bg: #f4ecdc; --carta: #fffaf0; --ink: #2a2018; --soft: #6b5a48; --linea: #e0d2b8;
  --acc: #8a2a12; --acc2: #b8862b; --ok: #2f6b3a; --bad: #a3271b; --sel: #fbe7c2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17130f; --carta: #221c16; --ink: #f1e6d4; --soft: #b9a68c; --linea: #3a3027;
    --acc: #e0794f; --acc2: #d9a94a; --ok: #6fbf7a; --bad: #ef7b6b; --sel: #3b2d1c; }
}
:root[data-theme="dark"] { --bg: #17130f; --carta: #221c16; --ink: #f1e6d4; --soft: #b9a68c; --linea: #3a3027;
  --acc: #e0794f; --acc2: #d9a94a; --ok: #6fbf7a; --bad: #ef7b6b; --sel: #3b2d1c; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 17px/1.5 Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
header { padding: 18px 16px 8px; max-width: 760px; margin: 0 auto; }
header h1 { margin: 0; font-size: 26px; letter-spacing: .5px; color: var(--acc); }
header .chi { color: var(--soft); font-size: 14px; }
.passi { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.passi span { font: 12px/1 -apple-system, system-ui, sans-serif; padding: 5px 8px; border-radius: 99px; background: var(--carta);
  border: 1px solid var(--linea); color: var(--soft); }
.passi span.ora { background: var(--acc); color: #fff; border-color: var(--acc); }
.passi span.fatto { color: var(--ok); border-color: var(--ok); }
main { max-width: 760px; margin: 0 auto; padding: 0 16px 120px; }
.card { background: var(--carta); border: 1px solid var(--linea); border-radius: 14px; padding: 18px; margin: 14px 0; }
h2 { margin: 0 0 6px; font-size: 22px; } h3 { margin: 18px 0 6px; font-size: 18px; color: var(--acc); }
p { margin: 6px 0; } .soft { color: var(--soft); font-size: 15px; }
.spiega { border-left: 3px solid var(--acc2); padding: 4px 10px; margin: 10px 0; color: var(--soft); font-size: 15px; background: color-mix(in srgb, var(--acc2) 7%, transparent); }
.scelte { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 10px 0; }
.opz { text-align: left; font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--linea); border-radius: 12px;
  padding: 12px; cursor: pointer; }
.opz:hover { border-color: var(--acc2); } .opz.sel { border-color: var(--acc); background: var(--sel); }
.opz b { display: block; font-size: 17px; } .opz small { display: block; color: var(--soft); font-size: 14px; margin-top: 3px; }
.opz .tag { font: 11px/1 -apple-system, system-ui, sans-serif; display: inline-block; padding: 3px 6px; border-radius: 6px; margin-top: 6px;
  background: var(--linea); color: var(--soft); }
.opz[disabled] { opacity: .45; cursor: not-allowed; }
button.btn { font: 16px -apple-system, system-ui, sans-serif; padding: 11px 18px; border-radius: 10px; border: 0; background: var(--acc);
  color: #fff; cursor: pointer; } button.btn:disabled, button.btn.spento { opacity: .45; }
button.sec { background: transparent; color: var(--acc); border: 2px solid var(--acc); }
button.piccolo { padding: 6px 10px; font-size: 14px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-top: 1px solid var(--linea); padding: 10px 16px; }
.nav .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.nav .msg { font: 13px/1.3 -apple-system, system-ui, sans-serif; color: var(--bad); flex: 1; text-align: center; }
input[type=text], input[type=number], select, textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--linea);
  border-radius: 8px; padding: 8px 10px; width: 100%; } textarea { min-height: 80px; }
label.campo { display: block; margin: 10px 0; } label.campo span { display: block; font-size: 14px; color: var(--soft); }
.dadi { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.dado { background: var(--bg); border: 1px solid var(--linea); border-radius: 12px; padding: 10px; text-align: center; }
.dado .tot { font-size: 34px; font-weight: bold; color: var(--acc); }
.dado .d { font: 15px -apple-system, system-ui, sans-serif; letter-spacing: 2px; color: var(--soft); }
.dado .d s { opacity: .5; }
.rot { animation: rot .6s ease-out; } @keyframes rot { from { transform: rotate(-200deg) scale(.4); opacity: 0; } }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; } .t td, .t th { padding: 6px 6px; border-bottom: 1px solid var(--linea); text-align: left; vertical-align: top; }
.t th { font: 12px -apple-system, system-ui, sans-serif; color: var(--soft); text-transform: uppercase; }
.num { text-align: center !important; white-space: nowrap; } .gr { font-weight: bold; color: var(--acc); }
.contatore { position: sticky; top: 0; z-index: 2; background: var(--carta); padding: 8px 0; border-bottom: 1px solid var(--linea);
  font: 15px -apple-system, system-ui, sans-serif; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.pill { display: inline-block; font: 12px -apple-system, system-ui, sans-serif; padding: 2px 7px; border-radius: 99px; background: var(--linea); color: var(--soft); }
.riga-sel { background: var(--sel); }
.filtri { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; } .filtri input { flex: 1; min-width: 160px; }
.riepilogo dt { font-size: 13px; color: var(--soft); margin-top: 8px; } .riepilogo dd { margin: 0; }
@media (max-width: 520px) { .passi span:not(.ora) { display: none; }
  body { font-size: 16px; } .scelte { grid-template-columns: 1fr; } .t { font-size: 14px; } }

.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 3; }
.tabs button { flex: 0 0 auto; font: 15px -apple-system, system-ui, sans-serif; padding: 9px 14px; border-radius: 99px; border: 1px solid var(--linea); background: var(--carta); color: var(--ink); }
.tabs button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.big div { background: var(--bg); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 6px; text-align: center; }
.big b { display: block; font-size: 26px; color: var(--acc); } .big span { font: 12px -apple-system, system-ui, sans-serif; color: var(--soft); }
.pf { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 8px 0; }
.pf .val { font-size: 44px; font-weight: bold; min-width: 120px; text-align: center; }
.pf button { font-size: 26px; width: 56px; height: 56px; border-radius: 50%; }
.slot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--acc); display: inline-block; margin: 3px; cursor: pointer; vertical-align: middle; }
.slot.usato { background: var(--acc); }
</style>
</head>

atore di Intelligenza del personaggio (e 1 punto bonus, se il personaggio è un umano) per determinare i punti totali guadagnati ogni livello (ma sempre almeno 1 punto abilità per livello, anche per un personaggio con una penalità di Intelligenza). Un personaggio di 1° livello inizia con quattro volte questo numero di punti abilità. Dal momento che il grado massimo in un'abilità di classe è il livello del personaggio +3, al 1° livello si possono acquisire fino a 4 gradi in ogni abilità di classe, al costo di un punto abilità per ogni grado.","formula":"(punti_classe + mod Int [+1 se umano], minimo 1) × 4","grado_max_classe_1_livello":4,"grado_max_classe_incrociata_1_livello":2,"costo_classe_incrociata":"2 punti per grado (1 punto = 1/2 grado)","esempio":"Vadania, mezzelfa druida con Int +1: (4+1)×4 = 20 punti","pagina_pdf":[24,25]},"regola_punti_ferita_1_livello":{"testo":"Al 1° livello il personaggio ottiene il massimo del suo Dado Vita, più il modificatore di Costituzione.","pagina_pdf":24},"incantesimi_bonus":{"pagina_pdf":9,"tabella":"Tabella 1-1: Modificatori di caratteristica e incantesimi bonus","nota":"Con punteggio 9 o meno non si possono lanciare incantesimi legati a quella caratteristica. Livello 0: nessun incantesimo bonus. Caratteristica: Int (mago), Sag (chierico, druido, paladino, ranger), Car (bardo, stregone).","righe":[{"punteggio":"1","modificatore":-5,"puo_lanciare":false,"bonus_0":null,"bonus_1":null},{"punteggio":"2-3","modificatore":-4,"puo_lanciare":false,"bonus_0":null,"bonus_1":null},{"punteggio":"4-5","modificatore":-3,"puo_lanciare":false,"bonus_0":null,"bonus_1":null},{"punteggio":"6-7","modificatore":-2,"puo_lanciare":false,"bonus_0":null,"bonus_1":null},{"punteggio":"8-9","modificatore":-1,"puo_lanciare":false,"bonus_0":null,"bonus_1":null},{"punteggio":"10-11","modificatore":0,"puo_lanciare":true,"bonus_0":0,"bonus_1":0},{"punteggio":"12-13","modificatore":1,"puo_lanciare":true,"bonus_0":0,"bonus_1":1},{"punteggio":"14-15","modificator   for (const [k, v] of Object.entries(m)) if (CAR_LUNGA[k.toLowerCase()] === c) return v; return 0; }
const base = c => S.assegnazione[c] ?? null;
const punteggio = c => base(c) == null ? null : base(c) + modRazza(c);
const mod = c => punteggio(c) == null ? 0 : modCar(punteggio(c));
function serieAttuale() { return S.serie == null ? null : serieCar(S.codice, S.serie); }

// ===== passi =====
const PASSI = [
  { id: 'inizio', nome: 'Inizio' }, { id: 'idea', nome: 'Idea' }, { id: 'razza', nome: 'Razza' }, { id: 'classe', nome: 'Classe' },
  { id: 'car', nome: 'Caratteristiche' }, { id: 'magia', nome: 'Doti di classe', se: () => typeof haMagia === 'function' && haMagia() },
  { id: 'abilita', nome: 'Abilità' }, { id: 'talenti', nome: 'Talenti' },
  { id: 'equip', nome: 'Equipaggiamento' }, { id: 'dett', nome: 'Dettagli' }, { id: 'fine', nome: 'Fine' }];
const attivi = () => PASSI.filter(p => !p.se || p.se());
const R = {};   // render per passo
const V = {};   // validazione per passo -> stringa di errore o ''

function disegna() {
  const ps = attivi(); if (S.passo >= ps.length) S.passo = ps.length - 1;
  const p = ps[S.passo];
  $('#passi').innerHTML = ps.map((x, i) => `<span class="${i === S.passo ? 'ora' : i < S.passo ? 'fatto' : ''}" title="${x.nome}">${i === S.passo ? `Passo ${i + 1} di ${ps.length}: ` : `${i + 1}. `}${x.nome}</span>`).join('');
  $('#chi').textContent = S.giocatore ? `Giocatore: ${S.giocatore}${S.codice ? ' · codice ' + S.codice : ''}` : '';
  $('#main').innerHTML = R[p.id]();
  if (R[p.id + '_dopo']) R[p.id + '_dopo']();
  if (S.chiuso) { S.passo = attivi().length - 1; }
  $('#indietro').style.visibility = S.passo && !S.chiuso ? 'visible' : 'hidden';
  $('#avanti').style.visibility = p.id === 'fine' ? 'hidden' : 'visible';
  aggiornaNav(); salva();
}
function aggiornaNav() {
  const p = attivi()[S.passo]; const err = V[p.id] ? V[p.id]() : '';
  $('#msg').textContent = err; $('#msg').style.fontWeight = ''; $('#avanti').classList.toggle('spento', !!err);
}
$('#avanti').onclick = () => { leggiInizio(); aggiornaNav(); const m = $('#msg').textContent;
  if (m) { const x = $('#msg'); x.style.fontWeight = 'bold'; x.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], 400); return; }
  S.passo++; disegna(); scrollTo(0, 0); };
$('#indietro').onclick = () => { if (S.chiuso) return; S.passo--; disegna(); scrollTo(0, 0); };
function ridisegna() { const y = scrollY; disegna(); scrollTo(0, y); }

// ===== 1. inizio =====

<p>Qui crei il tuo personaggio per <b>Dungeons &amp; Dragons 3.5</b>, passo per passo, seguendo il Manuale del Giocatore. Non serve sapere niente: ogni cosa è spiegata quando arriva.</p>
<div class="spiega">I dadi li tira la pagina quando premi il bottone, a partire dal tuo <b>codice personale</b>: escono sempre uguali, quindi c'è un solo tentativo. Alla fine scarichi un file e lo mandi al Dungeon Master (il DM, chi guida la partita).</div>
<label class="campo"><span>Il tuo nome (quello vero)</span><input type="text" id="giocatore" autocomplete="given-name" value="${esc(S.giocatore)}" placeholder="es. Luca"></label>
<label class="campo"><span>Codice personale (te l'ha dato il DM)</span><input type="text" id="codice" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(S.codice)}" placeholder="es. LUCA-7F3K-92QD" ${qs.get('codice') ? 'readonly' : ''}></label>
${S.serie != null ? '<p class="soft">Hai già tirato i dadi con questo codice: il codice non si può più cambiare.</p>' : ''}</div>`;

  const g = $('#giocatore'), c = $('#codice'); if (!g || !c) return;
  S.giocatore = g.value.trim();

};
V.inizio = () => !S.giocatore ? 'Scrivi il tuo nome' : !/^[A-Z]{1,6}-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(S.codice) ? 'Scrivi il codice che ti ha dato il DM' : '';

// ===== 2. idea =====

  { k: 'rissa', q: 'Quando scoppia una rissa, il tuo personaggio…', o: [
    ['mischia', 'Si butta in mezzo a menare', 'barbaro guerriero paladino monaco'], ['distanza', 'Colpisce da lontano', 'ranger guerriero'],

${IDEA.map(d => `<h3>${d.q}</h3><div class="scelte">${d.o.map(([id, t]) => `<button class="opz ${S.idea[d.k] === id ? 'sel' : ''}" data-k="${d.k}" data-v="${id}"><b>${t}</b></button>`).join('')}</div>`).join('')}

function classiConsigliate() {
  const c = {}; for (const d of IDEA) { const o = d.o.find(x => x[0] === S.idea[d.k]); if (o) o[2].split(' ').forEach(x => c[x] = (c[x] || 0) + 1); }
  return Object.entries(c).sort((a, b) => b[1] - a[1]).filter(x => x[1] === Math.max(...Object.values(c))).map(x => x[0]);

// ===== 3. razza =====
R.razza = () => `<div class="card"><h2>Razza</h2><p class="soft">Il popolo a cui appartiene il tuo personaggio. Cambia un po' le caratteristiche e dà qualche dote speciale.</p>
<div class="scelte">${D.razze.razze.map(r => `<button class="opz ${S.razza === r.id ? 'sel' : ''}" data-r="${r.id}"><b>${esc(r.nome)}</b><small>${esc(r.descrizione)}</small>
<span class="tag">${Object.entries(r.modificatori_caratteristica).filter(x => x[1]).map(([k, v]) => `${CAR_LUNGA[k.toLowerCase()]} ${sg(v)}`).join(' · ') || 'nessun modificatore'} · velocità ${r.velocita_base_m} m</span></button>`).join('')}</div>
${razza() ? `<h3>${esc(razza().nome)}: cosa sa fare</h3><ul>${razza().tratti.map(t => `<li><b>${esc(t.nome)}</b> — ${esc(t.effetto)}</li>`).join('')}</ul><p class="soft">Manuale del Giocatore, p.${razza().pagina_pdf} del PDF</p>` : ''}</div>`;
R.razza_dopo = () => document.querySelectorAll('.opz[data-r]').forEach(b => b.onclick = () => { if (S.razza !== b.dataset.r) { S.razza = b.dataset.r; S.equip = {}; S.dett.lingue = []; S.dett.altezza = S.dett.peso = S.dett.eta = ''; } ridisegna(); });
V.razza = () => S.razza ? '' : 'Scegli una razza';

// ===== 5. caratteristiche =====
const ORDINE_CONSIGLIATO = {  // consiglio per "assegna per me" (non è una regola)
  barbaro: 'FOR COS DES SAG CAR INT', bardo: 'CAR DES COS INT SAG FOR', chierico: 'SAG COS FOR CAR DES INT', druido: 'SAG COS DES INT FOR CAR',
  guerriero: 'FOR COS DES SAG INT CAR', ladro: 'DES INT COS SAG CAR FOR', mago: 'INT DES COS SAG CAR FOR', monaco: 'SAG DES FOR COS INT CAR',
  paladino: 'CAR FOR COS SAG DES INT', ranger: 'DES SAG FOR COS INT CAR', stregone: 'CAR DES COS INT SAG FOR' };
R.car = () => {
  const s = serieAttuale();
  if (!s) return `<div class="card"><h2>Caratteristiche</h2>
<p>Ogni personaggio ha 6 caratteristiche. Come dice il Manuale del Giocatore: per ognuna si tirano <b>4 dadi da 6</b>, si scarta il più basso e si sommano gli altri tre (da 3 a 18).</p>
<div class="spiega">Hai <b>un solo tentativo</b>: i dadi escono dal tuo codice personale, quindi anche se ricarichi la pagina escono uguali. Potrai ritirare solo nel caso previsto dal manuale (punteggi troppo bassi).</div>
<p style="text-align:center;margin:22px 0"><button class="btn" id="tira">🎲 Tira i dadi</button></p></div>`;
  const pts = s.map(x => x.punteggio), puo = ritiroPermesso(pts);
  const usati = Object.values(S.assegnazione);
  const liberi = pts.slice(); usati.forEach(v => { const i = liberi.indexOf(v); if (i >= 0) liberi.splice(i, 1); });
  return `<div class="card"><h2>I tuoi tiri ${S.serie ? `<span class="pill">ritiro n.${S.serie}</span>` : ''}</h2>
<div class="dadi">${s.map(x => { const d = [...x.dadi]; const mi = d.indexOf(Math.min(...d));
    return `<div class="dado rot"><div class="tot">${x.punteggio}</div><div class="d">${d.map((v, i) => i === mi ? `<s>${v}</s>` : v).join(' ')}</div></div>`; }).join('')}</div>
${puo ? `<div class="spiega">Questi punteggi sono bassi: il manuale ti permette di <b>ritirare</b> (somma dei modificatori 0 o meno, oppure il più alto è 13 o meno). È facoltativo: se ritiri, valgono i nuovi e non si torna indietro.
<p><button class="btn sec piccolo" id="ritira">Ritira i dadi</button></p></div>` : ''}
</div><div class="card"><h2>Assegna i punteggi</h2>${(() => { const ck = { mago: 'INT', chierico: 'SAG', druido: 'SAG', stregone: 'CAR', bardo: 'CAR' }[S.classe];
  return ck && punteggio(ck) != null && punteggio(ck) < 11 ? `<div class="spiega bad">⚠️ Con ${CAR_NOMI[ck]} ${punteggio(ck)} il tuo ${esc(nomeClasse(S.classe).toLowerCase())} non potrà lanciare incantesimi di 1° livello (serve almeno 11${punteggio(ck) < 10 ? '; sotto 10 neanche quelli di livello 0' : ''}).</div>` : ''; })()}<p class="soft">Metti ogni numero dove vuoi tu. Il numero dopo la freccia include la tua razza; il <b>modificatore</b> (+/−) è quello che conta nei tiri.</p>
<p><button class="btn sec piccolo" id="auto">Assegna per me (consigliato per ${esc(nomeClasse(S.classe) || 'la tua classe')})</button> <button class="btn sec piccolo" id="svuota">Svuota</button></p>
<table class="t"><tr><th>Caratteristica</th><th class="num">Tiro</th><th class="num">Razza</th><th class="num">Totale</th><th class="num">Mod.</th></tr>
${CAR.map(c => `<tr><td><b>${CAR_NOMI[c]}</b><br><span class="soft">${CAR_SPIEGA[c]}</span></td>
<td class="num"><select data-c="${c}" style="width:auto"><option value="">—</option>${[...new Set([...liberi, ...(base(c) != null ? [base(c)] : [])])].sort((a, b) => b - a).map(v => `<option ${base(c) === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
<td class="num">${modRazza(c) ? sg(modRazza(c)) : ''}</td><td class="num gr">${punteggio(c) ?? ''}</td><td class="num gr">${punteggio(c) == null ? '' : sg(mod(c))}</td></tr>`).join('')}</table></div>`;
};
R.car_dopo = () => {
  if ($('#tira')) $('#tira').onclick = () => { S.serie = 0; S.assegnazione = {}; ridisegna(); };
  if ($('#ritira')) $('#ritira').onclick = () => { S.serie++; S.assegnazione = {}; ridisegna(); };
  if ($('#svuota')) $('#svuota').onclick = () => { S.assegnazione = {}; ridisegna(); };
  if ($('#auto')) $('#auto').onclick = () => {
    const pts = serieAttuale().map(x => x.punteggio).sort((a, b) => b - a);
    const ord = (ORDINE_CONSIGLIATO[S.classe] || 'FOR DES COS INT SAG CAR').split(' ');
    S.assegnazione = {}; ord.forEach((c, i) => S.assegnazione[c] = pts[i]); ridisegna(); };
  document.querySelectorAll('select[data-c]').forEach(sel => sel.onchange = () => {
    const c = sel.dataset.c; if (sel.value === '') delete S.assegnazione[c]; else S.assegnazione[c] = +sel.value; ridisegna(); });
};
V.car = () => S.serie == null ? 'Tira i dadi' : CAR.some(c => base(c) == null) ? 'Assegna tutti e 6 i punteggi' : '';

// ===== 6. abilità =====
const AB = D.abilita.abilita;
const abById = id => AB.find(a => a.id === id);
const carAb = a => a.caratteristica_chiave ? CAR_LUNGA[a.caratteristica_chiave.toLowerCase()] : null;
function abDaDomini() { if (S.classe !== 'chierico') return []; const dm = (S.magia && S.magia.domini) || [];
  return (classe().domini || []).filter(d => dm.includes(d.nome)).flatMap(d => d.abilita_di_classe_aggiunte || []); }
const diClasse = id => { const a0 = abById(id); if (a0 && abDaDomini().includes(a0.nome)) return true;
  const r = D.abilita.tabella_abilita_per_classe.righe[id] || D.abilita.tabella_abilita_per_classe.righe[id.replace(/^conoscenze_.*/, 'conoscenze')];
  if (r && S.classe && r[S.classe] != null) return r[S.classe] === 'C';
  const a = abById(id); return !!(a && a.classi_di_classe && a.classi_di_classe.includes(S.classe)); };
function puntiAbilita() {
  const b = D.abilita.regole_generali.punti_abilita_per_livello.base_per_classe[S.classe] || 0;
  let p = Math.max(1, b + mod('INT')) * 4;
  const r = razza(); if (r) r.tratti.forEach(t => { if (t.dati.tipo === 'punti_abilita_extra') p += t.dati.primo_livello; });
  return p;
}
const spesi = () => Object.values(S.abilita).reduce((a, v) => a + v, 0);
const gradi = id => diClasse(id) ? (S.abilita[id] || 0) : (S.abilita[id] || 0) / 2;
const SPEC = ['artigianato', 'professione', 'intrattenere'];
function bonusRazzaAb(nome) { const r = razza(); let b = 0; if (!r) return 0;
  r.tratti.forEach(t => (t.dati.bonus_abilita || []).forEach(x => { if (!x.condizione && x.abilita === nome) b += x.valore; })); return b; }
function totaleAb(a) { return Math.floor(gradi(a.id)) + modCar(punteggio(carAb(a)) ?? 10) + bonusRazzaAb(a.nome); }
let filtroAb = '';
R.abilita = () => {
  const tot = puntiAbilita(), sp = spesi();
  const lista = AB.filter(a => !filtroAb || (a.nome + a.a_cosa_serve).toLowerCase().includes(filtroAb.toLowerCase()))
    .sort((x, y) => (diClasse(y.id) - diClasse(x.id)) || x.nome.localeCompare(y.nome));
  return `<div class="card"><h2>Abilità</h2>
<p>Le abilità sono le cose che il personaggio sa fare fuori dal combattimento puro: arrampicarsi, convincere, scassinare… Ogni <b>grado</b> che metti in un'abilità aggiunge +1 quando la usi.</p>
<div class="spiega"><b>Di classe</b> (⭐): 1 punto = 1 grado, massimo 4 gradi. <b>Incrociate</b>: 1 punto = ½ grado, massimo 2 gradi (cioè 4 punti). Devi spendere tutti i punti. Le abilità con ✋ si possono usare anche senza gradi.</div>
<div class="contatore">Punti: <b class="${sp === tot ? 'ok' : sp > tot ? 'bad' : ''}">${sp} / ${tot}</b> &nbsp; <span class="soft">((${D.abilita.regole_generali.punti_abilita_per_livello.base_per_classe[S.classe]} della classe ${sg(mod('INT'))} Int) × 4${razza() && razza().id === 'umano' ? ' + 4 umano' : ''})</span>
<button class="btn sec piccolo" id="abAzzera" style="float:right">Azzera</button></div>
<div class="filtri"><input type="text" id="abCerca" placeholder="Cerca un'abilità…" value="${esc(filtroAb)}"></div>
<table class="t"><tr><th>Abilità</th><th class="num">Gradi</th><th class="num">Totale</th></tr>
${lista.map(a => { const c = diClasse(a.id), p = S.abilita[a.id] || 0, max = 4;
  return `<tr class="${p ? 'riga-sel' : ''}"><td><b>${c ? '⭐ ' : ''}${esc(a.nome)}</b> <span class="pill">${carAb(a)}</span>${a.senza_addestramento ? ' ✋' : ''}
<br><span class="soft">${esc(a.a_cosa_serve)}</span>${SPEC.includes(a.id) && p ? `<br><input type="text" data-spec="${a.id}" placeholder="quale? (es. ${a.id === 'artigianato' ? 'fabbro' : a.id === 'professione' ? 'marinaio' : 'canto'})" value="${esc(S.spec[a.id] || '')}">` : ''}</td>
<td class="num"><button class="btn sec piccolo" data-meno="${a.id}" ${p ? '' : 'disabled'}>−</button> <b>${gradi(a.id)}</b> <button class="btn sec piccolo" data-piu="${a.id}" ${p >= max || sp >= tot ? 'disabled' : ''}>+</button></td>
<td class="num gr">${(a.senza_addestramento || p) ? sg(totaleAb(a)) : '—'}</td></tr>`; }).join('')}</table></div>`;
};
R.abilita_dopo = () => {
  document.querySelectorAll('[data-piu]').forEach(b => b.onclick = () => { S.abilita[b.dataset.piu] = (S.abilita[b.dataset.piu] || 0) + 1; ridisegna(); });
  document.querySelectorAll('[data-meno]').forEach(b => b.onclick = () => { const k = b.dataset.meno; S.abilita[k]--; if (!S.abilita[k]) delete S.abilita[k]; ridisegna(); });
  document.querySelectorAll('[data-spec]').forEach(i => i.oninput = () => { S.spec[i.dataset.spec] = i.value; salva(); aggiornaNav(); });
  $('#abAzzera').onclick = () => { S.abilita = {}; ridisegna(); };
  const c = $('#abCerca'); c.oninput = () => { filtroAb = c.value; ridisegna(); const n = $('#abCerca'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
};
V.abilita = () => { const t = puntiAbilita(), s = spesi();
  if (s !== t) return s < t ? `Ti restano ${t - s} punti da spendere` : `Hai speso ${s - t} punti di troppo`;
  for (const k of SPEC) if (S.abilita[k] && !(S.spec[k] || '').trim()) return `Scrivi quale ${abById(k).nome}`;
  return ''; };

// ===== 7. talenti =====

  return v;
}
const TAL_FISSI = { monaco: ['colpo_senz_armi_migliorato'], mago: ['scrivere_pergamene'], ranger: ['seguire_tracce'] };
const BONUS_CLASSE = { guerriero: { fonte: 'Talento bonus da guerriero', filtro: t => t.talento_guerriero },

  const imp = $('#importa'); if (imp) imp.onchange = () => { const f = imp.files[0]; if (!f) return; f.text().then(t => { try { const q = JSON.parse(t); if (!q.caratteristiche || !q.tiro) throw 0; salvaPG(q); TR = {}; salvaTR(); apriScheda(); } catch (e) { alert('File non valido'); } }); };
}
// avvio: se c'è già un personaggio finito su questo telefono apri la scheda, altrimenti la creazione
if (caricaPG() && !qs.has('crea') && (!qs.get('codice') || (caricaPG().tiro || {}).codice === qs.get('codice').toUpperCase())) { apriScheda(); sincronizza().then(apriScheda); }
else if (qs.get('codice') && !qs.has('crea')) {   // telefono nuovo: se il DM ha già pubblicato la scheda, aprila
  S.codice = qs.get('codice').toUpperCase(); disegna();
  fetch(`pg/${idOnline(S.codice)}.json?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(q => { if (q) { q.tiro = { ...(q.tiro || {}), codice: S.codice }; salvaPG(q); TR = {}; salvaTR(); sincronizza(true).then(apriScheda); } }).catch(() => {});
} else disegna();

</script>
</body>
</html>
