<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crea il tuo eroe</title>
<style>body{margin:0;background:#f4ecdc;color:#2a2018;font:17px Georgia,serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
@media (prefers-color-scheme: dark){body{background:#17130f;color:#f1e6d4}}</style></head>
<body><p id="m">⚔️ Carico…</p>
<script>
// Pagina-guscio: non cambia mai. Scarica l'ULTIMA versione dell'app direttamente dal repository (versione esatta, niente cache di GitHub Pages).
const RAW = 'https://raw.githubusercontent.com/manu814/dnd-creatore/';
const scrivi = h => { document.open(); document.write(h); document.close(); };
fetch('https://api.github.com/repos/manu814/dnd-creatore/commits/main', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject()).then(j => fetch(RAW + j.sha + '/app.html')).then(r => r.ok ? r.text() : Promise.reject()).then(scrivi)
  .catch(() => fetch('app.html?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(scrivi)
  .catch(() => { document.getElementById('m').innerHTML = 'Connessione assente: <a href="app.html' + location.search + '">riprova</a>'; }));
</script></body></html>
